<svg xmlns="http://www.w3.org/2000/svg" width="830" height="200" viewBox="0 0 830 200"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.dim{fill:#6b7399}.txt{fill:#c9d1e8}.b{font-weight:700}

    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    .cur{animation:blink 1.1s steps(1) infinite}
    </style><defs>
<linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="7" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><rect x="1" y="1" width="828" height="198" rx="14" fill="#0d0d1a" stroke="url(#frame)" stroke-opacity=".55" stroke-width="1.5"/>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#ff2bd6" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00f0ff"/>
    <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect x="1" y="1" width="828" height="198" rx="14"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="830" height="200" fill="url(#grid)"/>
  <circle cx="710" cy="40" r="150" fill="#ff2bd6" opacity=".07" filter="url(#glow2)"/>
  <circle cx="90" cy="190" r="140" fill="#00f0ff" opacity=".07" filter="url(#glow2)"/>
  <rect x="-300" y="176" width="300" height="2" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="x" from="-300" to="830" dur="5s" repeatCount="indefinite"/></rect>
</g>
<text x="48" y="52" font-size="13" class="dim">// github.com/perun-dev</text>
<text x="51" y="123" font-size="64" class="b" fill="#ff2bd6" opacity=".75">perun-dev</text>
<text x="48" y="120" font-size="64" class="b" fill="#00f0ff" filter="url(#glow)">perun-dev<tspan class="cur" fill="#ff2bd6">_</tspan></text>
<text x="48" y="162" font-size="18"><tspan fill="#ff2bd6">&gt;</tspan><tspan class="txt"> python · typescript · swift · kotlin</tspan></text>
</svg>